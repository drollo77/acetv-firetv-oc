<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AceTV - mando</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px system-ui, sans-serif; background: #101820; color: #eee; }
  header { position: sticky; top: 0; z-index: 2; background: #1b3a5c; padding: 10px 12px; }
  #now { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px; }
  #now.bad { color: #ff9d9d; white-space: normal; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row .grow { flex: 1; }
  input[type=search], input[type=text] { width: 100%; padding: 10px; border-radius: 8px; border: 0; font-size: 16px; }
  button { padding: 10px 14px; border-radius: 8px; border: 0; background: #2f6fb0; color: #fff; font-size: 16px; }
  button:disabled { opacity: .45; }
  button.alt { background: #4a5560; }
  #msg { font-size: 14px; min-height: 1.2em; }
  #msg.ok { color: #9be39b; }
  #msg.bad { color: #ff9d9d; }
  main { padding: 8px 12px 40px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li button { width: 100%; text-align: left; background: #1b2733; margin-bottom: 6px; }
  li small { display: block; opacity: .65; font-size: 12px; }
  #count { opacity: .7; font-size: 13px; margin: 6px 0; }
  details { background: #17222d; border-radius: 8px; padding: 8px 12px; margin-top: 12px; }
  summary { padding: 6px 0; font-weight: 600; }
  p.info { opacity: .8; font-size: 14px; margin: 6px 0; }
  #preview { font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div id="now">Conectando...</div>
  <div class="row">
    <button id="up" title="Canal anterior">&#9650;</button>
    <button id="down" title="Canal siguiente">&#9660;</button>
    <span id="msg" class="grow"></span>
  </div>
  <input id="q" type="search" placeholder="Buscar canal..." autocomplete="off">
</header>
<main>
  <div id="count"></div>
  <ul id="res"></ul>

  <details>
    <summary>ID manual</summary>
    <div class="row">
      <input id="hash" type="text" placeholder="40 caracteres hexadecimales" autocomplete="off">
      <button id="playid">Ver</button>
    </div>
  </details>

  <details>
    <summary>Motor Acestream</summary>
    <p class="info" id="engine"></p>
    <div class="row">
      <input id="hostin" type="text" placeholder="IP del motor, p. ej. 192.168.1.34" autocomplete="off">
      <button id="setengine">Cambiar</button>
    </div>
  </details>

  <details>
    <summary>Lista de canales</summary>
    <p class="info" id="listinfo"></p>
    <input id="file" type="file" accept=".json,.m3u,.m3u8,application/json,text/plain">
    <div id="preview"></div>
    <div class="row">
      <button id="replace" disabled>Sustituir lista actual</button>
      <button id="reset" class="alt">Volver a la incluida</button>
    </div>
  </details>
</main>

<script>
const BASE = "/s/{{CODE}}/";
const $ = (id) => document.getElementById(id);
let dead = false;

async function api(path, opts) {
  try {
    const r = await fetch(BASE + path, opts);
    const j = await r.json().catch(() => ({ ok: false, error: "Respuesta no valida" }));
    if (r.status === 410 || r.status === 403) {
      dead = true;
      $("now").textContent = j.error || "Sesion no disponible";
      $("now").className = "bad";
    }
    return j;
  } catch (e) {
    return { ok: false, error: "Sin conexion con la TV" };
  }
}

const post = (path, obj) => api(path, {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(obj)
});

function say(msg, bad) {
  const m = $("msg");
  m.textContent = msg || "";
  m.className = "grow " + (bad ? "bad" : "ok");
}

async function refresh() {
  if (dead) return;
  const s = await api("api/state");
  if (!s.ok) return;
  $("now").className = "";
  $("now").textContent = s.playing ? "\u25B6 " + s.playing.title : "Nada en reproduccion";
  $("engine").textContent = "Motor actual: " + s.host + " (" + String(s.mode).toUpperCase() + ")";
  $("listinfo").textContent = "Lista " + s.list.source + ": " + s.list.count + " canales, " + s.list.groups + " grupos";
}

let timer = null;
$("q").addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(search, 200);
});

async function search() {
  if (dead) return;
  const r = await api("api/search?limit=60&q=" + encodeURIComponent($("q").value));
  const ul = $("res");
  ul.textContent = "";
  if (!r.ok) {
    say(r.error, true);
    return;
  }
  for (const c of r.items) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.textContent = c.title;
    const small = document.createElement("small");
    small.textContent = c.group;
    b.appendChild(small);
    b.addEventListener("click", () => play(c.hash));
    li.appendChild(b);
    ul.appendChild(li);
  }
  $("count").textContent = r.total > r.items.length
    ? "Mostrando " + r.items.length + " de " + r.total
    : r.total + " canales";
}

async function play(hash) {
  const r = await post("api/play", { hash: hash });
  say(r.ok ? r.message : r.error, !r.ok);
  setTimeout(refresh, 600);
}

$("up").addEventListener("click", async () => {
  await post("api/zap", { delta: -1 });
  setTimeout(refresh, 900);
});
$("down").addEventListener("click", async () => {
  await post("api/zap", { delta: 1 });
  setTimeout(refresh, 900);
});
$("playid").addEventListener("click", () => play($("hash").value.trim()));

$("setengine").addEventListener("click", async () => {
  const h = $("hostin").value.trim();
  say("Comprobando el motor...", false);
  const r = await post("api/engine", { host: h });
  say(r.ok ? r.message : r.error, !r.ok);
  refresh();
});

$("file").addEventListener("change", async () => {
  const f = $("file").files[0];
  $("replace").disabled = true;
  $("preview").textContent = "";
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) {
    say("El fichero supera los 8 MB", true);
    return;
  }
  say("Leyendo " + f.name + "...", false);
  const text = await f.text();
  const r = await api("api/list/preview", {
    method: "POST",
    headers: { "Content-Type": "text/plain; charset=utf-8", "X-Filename": encodeURIComponent(f.name) },
    body: text
  });
  if (!r.ok) {
    say(r.error, true);
    return;
  }
  say("", false);
  let t = r.unique + " entradas (" + r.duplicates + " repetidas) = " + r.rows + " canales tras fusionar fuentes, en " + r.groupCount + " grupos. Formato " + r.kind + ".";
  t += " Grupos: " + r.groups.slice(0, 8).map((g) => g.name + " (" + g.count + ")").join(", ");
  if (r.groups.length > 8) t += ", ...";
  $("preview").textContent = t;
  $("replace").disabled = false;
});

$("replace").addEventListener("click", async () => {
  const r = await post("api/list/apply", { action: "replace" });
  say(r.ok ? r.message : r.error, !r.ok);
  $("replace").disabled = true;
  $("preview").textContent = "";
  $("file").value = "";
  refresh();
  search();
});

$("reset").addEventListener("click", async () => {
  if (!confirm("Volver a la lista incluida en la app?")) return;
  const r = await post("api/list/apply", { action: "reset" });
  say(r.ok ? r.message : r.error, !r.ok);
  refresh();
  search();
});

refresh();
search();
setInterval(refresh, 3000);
</script>
</body>
</html>
